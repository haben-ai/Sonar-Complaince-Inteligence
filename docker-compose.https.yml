# Adds automatic HTTPS (Let's Encrypt) in front of the app. Use together with the prod file:
#   docker compose -f docker-compose.prod.yml -f docker-compose.https.yml up -d
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. app.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  caddy-data:
